<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starfall Salvage — catch the falling stars</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0f1c; min-height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #9aa7bd;
    padding: 18px 10px; box-sizing: border-box;
  }
  canvas {
    width: min(1280px, 98vw); height: auto; aspect-ratio: 1280 / 800;
    border-radius: 10px; box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    background: #1b2340; cursor: crosshair; touch-action: none;
  }
  p { margin: 12px 0 0; font-size: 14px; text-align: center; }
  b { color: #e8ecf4; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<p><b>Starfall Salvage</b> — steer with ← → or the mouse, <b>Space</b> fires the pulse blaster, <b>P</b> pauses, <b>M</b> mutes.
Catch shards, dodge mines, spend salvage in the shop between waves, and clear wave 10.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
